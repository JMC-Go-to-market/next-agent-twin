# Stages a release on npm when a v* tag is pushed, through npm trusted publishing
# (OIDC): no npm token is stored anywhere. The trusted publisher (this repo + this
# file + environment npm) may only stage; a maintainer approves each staged release
# on npmjs.com with 2FA before it goes live.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1+; `npm stage` needs 11.21.
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run secrets
      - run: npm run check
      - run: npm run build
      - run: npm stage publish .
